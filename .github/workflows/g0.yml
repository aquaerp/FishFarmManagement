name: G0 Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  verify-g0:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore, build, and test
        shell: pwsh
        run: ./Scripts/Verify-G0.ps1 -ArtifactsRoot "${{ runner.temp }}\AquaFarm-G0"

